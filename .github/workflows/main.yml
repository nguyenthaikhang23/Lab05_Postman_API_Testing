name: Automated API Testing with Newman

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  api-testing:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Newman & htmlextra Reporter
      run: |
        npm install -g newman
        npm install -g newman-reporter-htmlextra

    - name: Run Postman Tests with Newman
      run: |
        newman run ReqRes_Collection.json -e ReqRes_Environment.json -d users.csv -r cli,htmlextra --reporter-htmlextra-export newman/report.html

    - name: Upload Test Report Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: newman-html-report
        path: newman/report.html
