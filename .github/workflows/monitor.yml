name: API Performance Monitor

on:
  schedule:
    - cron: '0 */6 * * *' # Tự động chạy định kỳ mỗi 6 tiếng (tùy chọn)
  workflow_dispatch:      # Cho phép bấm nút chạy thủ công trực tiếp trên web GitHub

jobs:
  api-monitor:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Newman & htmlextra Reporter
      run: |
        npm install -g newman
        npm install -g newman-reporter-htmlextra

    - name: Run Newman Performance Tests
      run: |
        newman run ReqRes_Collection.json -e ReqRes_Environment.json -d users.csv -r cli,htmlextra --reporter-htmlextra-export newman/monitor-report.html

    - name: Upload Monitor Report Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: monitor-html-report
        path: newman/monitor-report.html
